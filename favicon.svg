<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff2d75" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark neon tile base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#060913" stroke="url(#neonLogoGrad)" stroke-width="2.5" />
  <!-- Futuristic Sigma / NeoMath Symbol -->
  <path d="M14 14 h36 l-17 18 17 18 h-36 l14.5 -18 -14.5 -18 z" stroke="url(#neonLogoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(0, 240, 255, 0.12)" filter="url(#neonGlow)" />
  <!-- Vibrant glowing cyan core -->
  <circle cx="32" cy="32" r="3.8" fill="#00f0ff" filter="url(#neonGlow)" />
</svg>
